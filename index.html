<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE GREAT WEIGHT WAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #0a0a0a, #1a1a2e); }
    .neon-green { text-shadow: 0 0 25px #22ff88, 0 0 50px #22ff88; }
    .neon-orange { text-shadow: 0 0 25px #ff8866, 0 0 50px #ff8866; }
    .card { transition: all 0.3s; }
    .card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="text-white min-h-screen pb-12">
  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-6xl font-bold text-center neon-green mb-2">THE GREAT WEIGHT WAR</h1>
    <p class="text-center text-emerald-400 text-2xl mb-6">Call vs Martin — 1 November 2026</p>
    
    <!-- Nedräknare -->
    <div id="countdown" class="text-center text-4xl font-bold mb-12 text-yellow-400"></div>

    <div class="grid md:grid-cols-2 gap-8">
      <!-- Call -->
      <div class="card bg-zinc-900/90 border-2 border-emerald-500 rounded-3xl p-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-4xl font-bold text-emerald-400">CALL 🟢</h2>
          <div id="call-profile" class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-emerald-500"></div>
        </div>
        
        <input type="file" id="call-profile-upload" accept="image/*" class="hidden" onchange="uploadProfile('call')">
        <button onclick="document.getElementById('call-profile-upload').click()" 
                class="text-xs bg-zinc-800 px-4 py-2 rounded-xl mb-6">↑ Byt profilbild</button>

        <div id="call-start" class="text-2xl mb-6"></div>
        
        <input id="call-weight" type="number" step="0.1" placeholder="Nuvarande vikt (kg)" 
               class="w-full bg-zinc-800 text-3xl p-5 rounded-2xl border border-zinc-700 focus:border-emerald-500">
        
        <input id="call-comment" type="text" placeholder="Kommentar denna vecka" 
               class="w-full mt-4 bg-zinc-800 p-4 rounded-2xl border border-zinc-700">
        
        <input type="file" id="call-image" accept="image/*" class="hidden" onchange="uploadWeeklyImage('call')">
        <button onclick="document.getElementById('call-image').click()" 
                class="mt-4 w-full bg-zinc-700 hover:bg-zinc-600 py-3 rounded-2xl text-sm">+ Lägg till veckobild</button>

        <button onclick="updateWeight('call')" 
                class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-2xl text-xl font-bold">
          SPARA VIKT & UPPDATERING
        </button>
        
        <div id="call-history" class="mt-8 space-y-6"></div>
      </div>

      <!-- Martin -->
      <div class="card bg-zinc-900/90 border-2 border-orange-500 rounded-3xl p-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-4xl font-bold text-orange-400">MARTIN 🔴</h2>
          <div id="martin-profile" class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-orange-500"></div>
        </div>
        
        <input type="file" id="martin-profile-upload" accept="image/*" class="hidden" onchange="uploadProfile('martin')">
        <button onclick="document.getElementById('martin-profile-upload').click()" 
                class="text-xs bg-zinc-800 px-4 py-2 rounded-xl mb-6">↑ Byt profilbild</button>

        <div id="martin-start" class="text-2xl mb-6"></div>
        
        <input id="martin-weight" type="number" step="0.1" placeholder="Nuvarande vikt (kg)" 
               class="w-full bg-zinc-800 text-3xl p-5 rounded-2xl border border-zinc-700 focus:border-orange-500">
        
        <input id="martin-comment" type="text" placeholder="Kommentar denna vecka" 
               class="w-full mt-4 bg-zinc-800 p-4 rounded-2xl border border-zinc-700">
        
        <input type="file" id="martin-image" accept="image/*" class="hidden" onchange="uploadWeeklyImage('martin')">
        <button onclick="document.getElementById('martin-image').click()" 
                class="mt-4 w-full bg-zinc-700 hover:bg-zinc-600 py-3 rounded-2xl text-sm">+ Lägg till veckobild</button>

        <button onclick="updateWeight('martin')" 
                class="mt-6 w-full bg-orange-600 hover:bg-orange-500 py-6 rounded-2xl text-xl font-bold">
          SPARA VIKT & UPPDATERING
        </button>
        
        <div id="martin-history" class="mt-8 space-y-6"></div>
      </div>
    </div>

    <!-- Graf -->
    <div class="mt-12 bg-zinc-900/90 rounded-3xl p-8">
      <h3 class="text-2xl font-bold mb-6 text-center">VIKTSUTVECKLING</h3>
      <canvas id="weightChart" height="160"></canvas>
    </div>

    <!-- Status -->
    <div id="status" class="mt-10 text-center text-4xl font-bold py-8 rounded-3xl"></div>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem('weightWar2026')) || {
      call: { start: null, profile: null, entries: [] },
      martin: { start: null, profile: null, entries: [] }
    };

    function saveData() {
      localStorage.setItem('weightWar2026', JSON.stringify(data));
      renderAll();
    }

    function uploadProfile(person) {
      const file = document.getElementById(person + '-profile-upload').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        data[person].profile = e.target.result;
        saveData();
      };
      reader.readAsDataURL(file);
    }

    function uploadWeeklyImage(person) {
      const file = document.getElementById(person + '-image').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const weightInput = document.getElementById(person + '-weight');
        if (!weightInput.value) {
          alert("Ange vikt först!");
          return;
        }
        updateWeight(person, e.target.result);
      };
      reader.readAsDataURL(file);
    }

    function updateWeight(person, imageData = null) {
      const weightInput = document.getElementById(person + '-weight');
      const commentInput = document.getElementById(person + '-comment');
      const weight = parseFloat(weightInput.value);
      
      if (!weight) return alert("Ange en vikt!");

      if (!data[person].start) data[person].start = weight;

      data[person].entries.push({
        date: new Date().toISOString().split('T')[0],
        weight: weight,
        comment: commentInput.value.trim(),
        image: imageData
      });

      weightInput.value = '';
      commentInput.value = '';
      saveData();
    }

    function renderAll() {
      renderPerson('call');
      renderPerson('martin');
      updateChart();
      updateStatus();
      updateCountdown();
    }

    function renderPerson(person) {
      // Profile image
      const profileDiv = document.getElementById(person + '-profile');
      if (data[person].profile) {
        profileDiv.innerHTML = `<img src="${data[person].profile}" class="w-full h-full object-cover">`;
      }

      // Start weight
      document.getElementById(person + '-start').innerHTML = data[person].start ? 
        `Start: <span class="text-4xl font-bold">${data[person].start} kg</span>` : 'Ingen startvikt än';

      // History
      const historyEl = document.getElementById(person + '-history');
      let html = '';
      data[person].entries.forEach(entry => {
        html += `
          <div class="bg-zinc-800/70 p-5 rounded-2xl">
            <div class="flex justify-between items-center mb-3">
              <span class="font-mono">${entry.date}</span>
              <span class="text-2xl font-bold">${entry.weight} kg</span>
            </div>
            ${entry.comment ? `<p class="text-zinc-400 mb-4">${entry.comment}</p>` : ''}
            ${entry.image ? `<img src="${entry.image}" class="w-full rounded-2xl mt-3">` : ''}
          </div>`;
      });
      historyEl.innerHTML = html || '<p class="text-zinc-500">Inga uppdateringar än...</p>';
    }

    // (Resten av funktionerna är desamma som tidigare - updateStatus, updateCountdown, updateChart)
    function updateStatus() {
      const callLatest = data.call.entries.length ? data.call.entries[data.call.entries.length-1].weight : data.call.start;
      const martinLatest = data.martin.entries.length ? data.martin.entries[data.martin.entries.length-1].weight : data.martin.start;
      
      const statusEl = document.getElementById('status');
      if (!callLatest || !martinLatest) {
        statusEl.innerHTML = 'Väntar på startvikter...';
        statusEl.className = "mt-10 text-center text-4xl font-bold py-8 rounded-3xl bg-zinc-800";
        return;
      }

      const diff = (martinLatest - callLatest).toFixed(1);
      if (diff > 0) {
        statusEl.innerHTML = `CALL LEDER MED ${diff} KG 🏆`;
        statusEl.className = "
