<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE GREAT WEIGHT WAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #0a0a0a, #1a1a2e); }
    .neon { text-shadow: 0 0 20px #22ff88, 0 0 40px #22ff88; }
  </style>
</head>
<body class="text-white min-h-screen pb-12">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-6xl font-bold text-center neon mb-2">THE GREAT WEIGHT WAR</h1>
    <p class="text-center text-emerald-400 text-xl mb-8">Call vs Martin — 1 November 2026</p>

    <div class="grid md:grid-cols-2 gap-8">
      <!-- Call -->
      <div class="bg-zinc-900/80 border border-emerald-500 rounded-3xl p-8">
        <h2 class="text-4xl font-bold text-emerald-400 mb-6">CALL 🟢</h2>
        <div id="call-start" class="text-2xl mb-4"></div>
        <input id="call-weight" type="number" step="0.1" placeholder="Nuvarande vikt (kg)" 
               class="w-full bg-zinc-800 text-3xl p-4 rounded-2xl focus:outline-none focus:border-emerald-500 border border-zinc-700">
        <button onclick="updateWeight('call')" 
                class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl text-xl font-bold transition">
          SPARA VIKT
        </button>
        <div id="call-history" class="mt-6 text-sm"></div>
      </div>

      <!-- Martin -->
      <div class="bg-zinc-900/80 border border-orange-500 rounded-3xl p-8">
        <h2 class="text-4xl font-bold text-orange-400 mb-6">MARTIN 🔴</h2>
        <div id="martin-start" class="text-2xl mb-4"></div>
        <input id="martin-weight" type="number" step="0.1" placeholder="Nuvarande vikt (kg)" 
               class="w-full bg-zinc-800 text-3xl p-4 rounded-2xl focus:outline-none focus:border-orange-500 border border-zinc-700">
        <button onclick="updateWeight('martin')" 
                class="mt-4 w-full bg-orange-600 hover:bg-orange-500 py-4 rounded-2xl text-xl font-bold transition">
          SPARA VIKT
        </button>
        <div id="martin-history" class="mt-6 text-sm"></div>
      </div>
    </div>

    <!-- Graf -->
    <div class="mt-10 bg-zinc-900/80 rounded-3xl p-8">
      <h3 class="text-2xl font-bold mb-6 text-center">VIKTSUTVECKLING</h3>
      <canvas id="weightChart" height="120"></canvas>
    </div>

    <!-- Status -->
    <div id="status" class="mt-8 text-center text-3xl font-bold"></div>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem('weightWar')) || {
      startDate: new Date().toISOString().split('T')[0],
      call: { start: null, weights: [] },
      martin: { start: null, weights: [] }
    };

    const chartData = {
      labels: [],
      call: [],
      martin: []
    };

    function saveData() {
      localStorage.setItem('weightWar', JSON.stringify(data));
      renderAll();
    }

    function updateWeight(person) {
      const input = document.getElementById(person + '-weight');
      const weight = parseFloat(input.value);
      if (!weight) return alert("Skriv in en vikt!");

      if (!data[person].start) {
        data[person].start = weight;
      }

      data[person].weights.push({
        date: new Date().toISOString().split('T')[0],
        weight: weight
      });

      input.value = '';
      saveData();
    }

    function renderAll() {
      // Startvikter
      document.getElementById('call-start').innerHTML = data.call.start ? 
        `Start: <span class="text-4xl">${data.call.start} kg</span>` : 'Ingen startvikt än';
      
      document.getElementById('martin-start').innerHTML = data.martin.start ? 
        `Start: <span class="text-4xl">${data.martin.start} kg</span>` : 'Ingen startvikt än';

      // Historik
      renderHistory('call');
      renderHistory('martin');

      // Graf
      updateChart();

      // Status
      const callLatest = data.call.weights.length ? data.call.weights[data.call.weights.length-1].weight : data.call.start;
      const martinLatest = data.martin.weights.length ? data.martin.weights[data.martin.weights.length-1].weight : data.martin.start;

      let statusHTML = '';
      if (callLatest && martinLatest) {
        const diff = (martinLatest - callLatest).toFixed(1);
        if (diff > 0) {
          statusHTML = `<span class="text-emerald-400">CALL LEDER MED ${diff} KG</span>`;
        } else if (diff < 0) {
          statusHTML = `<span class="text-orange-400">MARTIN LEDER MED ${Math.abs(diff)} KG</span>`;
        } else {
          statusHTML = `<span class="text-yellow-400">JÄMNT LÄGE!</span>`;
        }
      }
      document.getElementById('status').innerHTML = statusHTML;
    }

    function renderHistory(person) {
      const container = document.getElementById(person + '-history');
      let html = '<div class="font-bold mb-2">Historik:</div>';
      const entries = data[person].weights;
      entries.forEach(entry => {
        html += `<div class="flex justify-between py-1 border-b border-zinc-700">
          <span>${entry.date}</span>
          <span class="font-mono">${entry.weight} kg</span>
        </div>`;
      });
      container.innerHTML = html;
    }

    function updateChart() {
      // Simple chart update (you can expand dates)
      const ctx = document.getElementById('weightChart');
      if (window.myChart) window.myChart.destroy();

      window.myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.call.weights.map(w => w.date).concat(data.martin.weights.map(w => w.date)).filter((v, i, a) => a.indexOf(v) === i).sort(),
          datasets: [
            {
              label: 'Call',
              data: data.call.weights.map(w => w.weight),
              borderColor: '#22ff88',
              tension: 0.3,
              borderWidth: 4
            },
            {
              label: 'Martin',
              data: data.martin.weights.map(w => w.weight),
              borderColor: '#ff8866',
              tension: 0.3,
              borderWidth: 4
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#ddd', font: { size: 16 } } } },
          scales: { y: { grid: { color: '#333' }, ticks: { color: '#aaa' } }, x: { grid: { color: '#333' }, ticks: { color: '#aaa' } }}
        }
      });
    }

    // Init
    renderAll();
  </script>
</body>
</html>
